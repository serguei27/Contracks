[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Past material stays on the old site until it is republished
[[redirects]]
  from = "/articles/*"
  to = "https://contracks.netlify.app/articles/:splat"
  status = 302
[[redirects]]
  from = "/audio/*"
  to = "https://contracks.netlify.app/audio/:splat"
  status = 302

# The book has its own page
[[redirects]]
  from = "/book"
  to = "https://serguei-poppeleer.netlify.app/book"
  status = 302
[[redirects]]
  from = "/book.html"
  to = "https://serguei-poppeleer.netlify.app/book"
  status = 302

# French is retired for now
[[redirects]]
  from = "/fr"
  to = "/"
  status = 302
[[redirects]]
  from = "/fr/*"
  to = "/"
  status = 302
